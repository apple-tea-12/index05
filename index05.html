<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>丁半博打</title>
<style>
  * { box-sizing: border-box; user-select: none; touch-action: manipulation; }
  body { background:#181412; color:#f5f5f4; text-align:center; font-family:serif; margin:0; padding:15px; overflow:hidden; transition:background 0.2s; }
  .win-flash { background:#451a03 !important; }
  .lose-shake { animation: shake 0.4s; background:#450a0a !important; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-12px)} 75%{transform:translateX(12px)} }

  .top-bar { display:flex; justify-content:space-between; background:#292524; padding:10px 15px; border-radius:8px; border:1px solid #78350f; font-size:15px; }
  .gold { color:#fbbf24; font-weight:bold; font-size:18px; }
  .rank { display:inline-block; background:#b45309; color:#fff; padding:3px 10px; border-radius:4px; font-size:13px; margin-top:10px; }

  /* 3Dサイコロ */
  .stage { display:flex; justify-content:center; gap:40px; margin:32px 0; perspective:600px; }
  .cube { width:64px; height:64px; position:relative; transform-style:preserve-3d; transition:transform 0.75s cubic-bezier(0.15, 0.9, 0.3, 1.15); }
  .face { position:absolute; width:64px; height:64px; background:#fafaf9; color:#1c1917; border:2px solid #d6d3d1; border-radius:10px; font-size:32px; font-weight:bold; display:flex; align-items:center; justify-content:center; box-shadow:inset 0 0 12px rgba(0,0,0,0.2); }
  .f1 { transform:rotateY(0deg) translateZ(32px); color:#dc2626; font-size:38px; }
  .f2 { transform:rotateY(90deg) translateZ(32px); }
  .f3 { transform:rotateX(90deg) translateZ(32px); }
  .f4 { transform:rotateX(-90deg) translateZ(32px); }
  .f5 { transform:rotateY(-90deg) translateZ(32px); }
  .f6 { transform:rotateY(180deg) translateZ(32px); }

  #msg { font-size:18px; min-height:54px; line-height:1.4; margin:10px 0; }
  .bet-select { display:flex; justify-content:center; gap:10px; margin-bottom:14px; }
  .bet-btn { background:#292524; color:#d6d3d1; border:1px solid #57534e; padding:8px 16px; border-radius:6px; font-size:14px; cursor:pointer; }
  .bet-btn.active { background:#b45309; color:#fff; border-color:#fbbf24; font-weight:bold; }

  .play-btns { display:flex; gap:12px; max-width:400px; margin:0 auto; }
  .p-btn { flex:1; font-size:22px; font-weight:bold; padding:18px 0; border:none; border-radius:10px; color:#fff; box-shadow:0 4px 0 rgba(0,0,0,0.5); cursor:pointer; }
  .p-btn:active { transform:translateY(3px); box-shadow:none; }
  .p-btn:disabled { opacity:0.4; }
  
  #share { margin-top:18px; background:#000; color:#fff; border:1px solid #57534e; padding:10px 22px; border-radius:20px; font-size:14px; text-decoration:none; display:none; }
</style>
</head>
<body>
  <div class="top-bar">
    <div>所持金：<span id="money" class="gold">1,000</span>両</div>
    <div>連勝：<span id="streak" class="gold">0</span>回</div>
  </div>
  <div class="rank" id="rank">称号：見習い博徒</div>

  <div class="stage">
    <div id="c1" class="cube">
      <div class="face f1">●</div><div class="face f2">二</div><div class="face f3">三</div>
      <div class="face f4">四</div><div class="face f5">五</div><div class="face f6">六</div>
    </div>
    <div id="c2" class="cube">
      <div class="face f1">●</div><div class="face f2">二</div><div class="face f3">三</div>
      <div class="face f4">四</div><div class="face f5">五</div><div class="face f6">六</div>
    </div>
  </div>

  <div id="msg">賭け方を選んで「丁」か「半」に張れ！</div>

  <div class="bet-select">
    <button class="bet-btn" id="mHalf" onclick="setMode('half')">堅実に半額賭け</button>
    <button class="bet-btn active" id="mAll" onclick="setMode('all')">🔥 全額勝負（倍プッシュ）</button>
  </div>

  <div class="play-btns">
    <button id="b1" class="p-btn" onclick="play('丁')" style="background:#dc2626;">丁（偶数）</button>
    <button id="b2" class="p-btn" onclick="play('半')" style="background:#2563eb;">半（奇数）</button>
  </div>
  
  <a id="share" href="#" target="_blank" rel="noopener noreferrer">𝕏 この戦績をポストする</a>

  <script>
    let money = 1000, streak = 0, maxMoney = 1000, spin = 0, mode = 'all';
    const rot = { 1:[0,0], 2:[0,-90], 3:[-90,0], 4:[90,0], 5:[0,90], 6:[0,180] };
    const ranks = ['見習い博徒', '街の勝負師', '鉄火場の常連', '凄腕の壺振り', '伝説の胴元', '博打の神'];
    let ctx = null;

    function beep(freq, type, dur, delay=0) {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, ctx.currentTime + delay);
      g.gain.setValueAtTime(0.15, ctx.currentTime + delay);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime + delay); o.stop(ctx.currentTime + delay + dur);
    }

    function setMode(m) {
      mode = m;
      mHalf.className = 'bet-btn' + (m === 'half' ? ' active' : '');
      mAll.className = 'bet-btn' + (m === 'all' ? ' active' : '');
    }

    function play(choice) {
      b1.disabled = b2.disabled = true;
      document.body.className = '';
      
      const bet = mode === 'all' ? money : Math.max(100, Math.floor(money / 2));
      msg.textContent = `${bet.toLocaleString()}両を賭けた… 入ります！`;
      
      [0, 0.1, 0.2, 0.35, 0.5].forEach((t, i) => beep(600 + i*80, 'triangle', 0.08, t));

      spin += 720;
      const d1 = Math.ceil(Math.random() * 6), d2 = Math.ceil(Math.random() * 6);
      c1.style.transform = `rotateX(${rot[d1][0] + spin}deg) rotateY(${rot[d1][1] + spin}deg)`;
      c2.style.transform = `rotateX(${rot[d2][0] - spin}deg) rotateY(${rot[d2][1] + spin}deg)`;

      setTimeout(() => {
        const res = (d1 + d2) % 2 === 0 ? '丁' : '半';
        const isPinzoro = (d1 === 1 && d2 === 1);

        if (choice === res) {
          const bonus = isPinzoro ? bet * 3 : bet;
          money += bonus; streak++;
          if (money > maxMoney) maxMoney = money;
          document.body.className = 'win-flash';
          if (navigator.vibrate) navigator.vibrate([50, 40, 80]);
          [523, 659, 784, 1046].forEach((f, i) => beep(f, 'sine', 0.25, i*0.07));
          msg.innerHTML = `<span style="color:#fbbf24; font-weight:bold;">${isPinzoro ? '🔥ピンゾロ（3倍）！' : ''}${d1}と${d2}で【${res}】！当たり！</span><br>+${bonus.toLocaleString()}両 獲得！`;
        } else {
          money -= bet; streak = 0;
          document.body.className = 'lose-shake';
          if (navigator.vibrate) navigator.vibrate(250);
          beep(140, 'sawtooth', 0.5);
          if (money <= 0) {
            msg.innerHTML = `<span style="color:#f87171;">${d1}と${d2}で【${res}】… 破産！</span><br>借金1,000両で再スタート…`;
            money = 1000;
          } else {
            msg.innerHTML = `<span style="color:#f87171;">${d1}と${d2}で【${res}】… ハズレ！</span><br>${bet.toLocaleString()}両を失った…`;
          }
        }

        document.getElementById('money').textContent = money.toLocaleString();
        document.getElementById('streak').textContent = streak;
        const currentRank = ranks[Math.min(streak, ranks.length - 1)];
        rank.textContent = '称号：' + currentRank;
        
        // X投稿リンクの更新
        const postText = `【丁半博打】最高所持金 ${maxMoney.toLocaleString()}両（現在 ${streak}連勝 / ${currentRank}）達成！\n#丁半博打 #ブラウザゲーム`;
        share.href = `https://x.com{encodeURIComponent(postText)}`;
        share.style.display = 'inline-block';

        b1.disabled = b2.disabled = false;
      }, 750);
    }
  </script>
</body>
</html>
